    }
  };
  var RTL = { ar: 1, ur: 1 };

  var listEl = document.getElementById('list');

  var keys = [];

  var query = '';
  var lang = 'id';

  function nkProof(kt, ts) {
    var s = kt + ':' + ts + ':nk26';
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    h ^= (h >>> 13);
    h = Math.imul(h, 0x85EBCA6B) >>> 0;
    h ^= (h >>> 16);
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }

  var __T0 = Date.now();
  function authHeaders(extra) {
    var baseTs = window.__KTS || Math.floor(__T0 / 1000);
    var ts = String(baseTs + Math.max(0, Math.floor((Date.now() - __T0) / 1000)));
    var kt = window.__KT || '';
    var h = { 'X-Key-Token': kt, 'X-Key-Ts': ts, 'X-Key-Proof': nkProof(kt, ts) };
    if (extra) { Object.keys(extra).forEach(function (k) { h[k] = extra[k]; }); }
    return h;
  }

  function deobf(b64, key) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function detectLang() {
    try {
      var savedLang = localStorage.getItem(LANG_LS);
      if (savedLang && I18N[savedLang]) { return savedLang; }
    } catch (e) {}
    var nav = (navigator.language || navigator.userLanguage || 'id').toLowerCase();
    var base = nav.split('-')[0];
    if (I18N[base]) { return base; }
    return 'en';
  }

  lang = detectLang();

  try {
    var saved = JSON.parse(localStorage.getItem(USED_LS) || '[]');
    if (Array.isArray(saved)) { used = saved.filter(function (v) { return typeof v === 'string'; }); }
  } catch (e) { used = []; }

  try { hideUsed = localStorage.getItem(HIDE_LS) === '1'; } catch (e) {}
  hideEl.checked = hideUsed;

  function t(key, vars) {
    var dict = I18N[lang] || I18N.en;
    var s = dict[key] || I18N.en[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        s = s.split('{' + k + '}').join(String(vars[k]));
      });
    }
    return s;
  }

  function fmt(n) {
    try { return n.toLocaleString(lang === 'ar' || lang === 'ur' ? 'en-US' : lang); }
    catch (e) { return String(n); }
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL[lang] ? 'rtl' : 'ltr';
    langEl.value = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function (el) {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
  }

  function persistUsed() {
    try { localStorage.setItem(USED_LS, JSON.stringify(used)); } catch (e) {}
  }

  function isUsed(k) { return used.indexOf(k) !== -1; }

  function setUsed(k, nextUsed, withUndo) {
    if (nextUsed) {
      if (!isUsed(k)) { used.push(k); }
    } else {
      used = used.filter(function (x) { return x !== k; });
    }
    persistUsed();
    render();
    if (withUndo && nextUsed) {
      toast(t('markedUsed'), false, t('undo'), function () {
        setUsed(k, false, false);
      }, 5000);
    }
  }

  function track(name) {
    try {
      var body = 'e=' + encodeURIComponent(name);
      if (navigator.sendBeacon) {
        navigator.sendBeacon('?action=event&t=' + Date.now(), new Blob([body], { type: 'application/x-www-form-urlencoded' }));
        return;
      }
      fetch('?action=event', {
        method: 'POST', credentials: 'same-origin', keepalive: true,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Key-Token': window.__KT || '' },
        body: body
      }).catch(function () {});
    } catch (e) {}
  }

  var SOAL_SEEN_LS = 'nusukkey.soal_seen.v1';
  var soalLinkEl = document.getElementById('soalLink');
  var soalAff = soalLinkEl && soalLinkEl.getAttribute('data-aff') === '1';
  var soalAffUrl = soalAff ? soalLinkEl.getAttribute('data-url') : '';
  var soalMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var soalAffDone = false;
  try { soalAffDone = document.cookie.split('; ').indexOf('nk_aff=1') !== -1; } catch (e) {}
  if (soalLinkEl) {
    try {
      if (localStorage.getItem(SOAL_SEEN_LS) !== '1') { soalLinkEl.classList.add('is-new'); }
    } catch (e) { soalLinkEl.classList.add('is-new'); }
    soalLinkEl.addEventListener('click', function (e) {
      soalLinkEl.classList.remove('is-new');
      try { localStorage.setItem(SOAL_SEEN_LS, '1'); } catch (err) {}
      track('soal');

        soalAffDone = true;
        track('aff_soal');
        return;
      }
      if (soalMobile) {
        try { document.cookie = 'nk_aff=1; path=/; max-age=86400; SameSite=Lax; Secure'; } catch (err) {}
        soalAffDone = true;
        track('aff_soal');
        e.preventDefault();
        window.location.assign('/soal.php?aff=1');
      }
    });
  }

  function fallbackCopy(text) {
    var el = document.createElement('textarea');
    el.value = text;
    el.setAttribute('readonly', '');
    el.style.position = 'fixed';
    el.style.top = '-1000px';
    document.body.appendChild(el);
    el.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(el);
  }

  function copyText(text, btn) {
    var done = function () {
      var original = btn.textContent;
      btn.textContent = t('copied');
      setTimeout(function () { btn.textContent = original; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
      return;
    }
    fallbackCopy(text);
    done();
  }

  function makeRow(k, n) {
    var usedNow = isUsed(k);

    var li = document.createElement('li');
    li.className = 'row' + (usedNow ? ' used' : '');

    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = n;

    var tick = document.createElement('button');
    tick.type = 'button';
    tick.className = 'tick';
    tick.textContent = '✓';
    tick.setAttribute('aria-pressed', usedNow ? 'true' : 'false');
    tick.setAttribute('aria-label', usedNow ? t('unmarkUsed') : t('markUsed'));
    tick.addEventListener('click', function () { setUsed(k, !usedNow, false); });

    var span = document.createElement('span');
    span.className = 'k';
    span.textContent = k;

    var acts = document.createElement('div');
    acts.className = 'acts';

    var copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'act';
    copyBtn.textContent = t('copy');
    copyBtn.addEventListener('click', function () { copyText(k, copyBtn); track('copy'); });

    var openLink = document.createElement('a');
    openLink.className = 'act open';
    openLink.href = BASE + encodeURIComponent(k);
    openLink.target = '_blank';
    openLink.rel = 'noopener noreferrer';
    openLink.textContent = t('open');
    openLink.addEventListener('click', function (e) {
      track('open');
      if (!isUsed(k)) { setUsed(k, true, true); }
      var affU = window.__AFF || '';
      var openDone = false;
      try { openDone = document.cookie.split('; ').indexOf('nk_aff_open=1') !== -1; } catch (err) {}
      if (!affU || openDone) { return; }
      var OPEN_N_LS = 'nusukkey.open_n.v1';
      var n = 0;
      try { n = (Number(localStorage.getItem(OPEN_N_LS) || 0) || 0) + 1; } catch (err) { n = 1; }
      if (n < (window.__AFF_N || 5)) {
        try { localStorage.setItem(OPEN_N_LS, String(n)); } catch (err) {}
        return;
      }
      try { localStorage.setItem(OPEN_N_LS, '0'); } catch (err) {}
      try { document.cookie = 'nk_aff_open=1; path=/; max-age=86400; SameSite=Lax; Secure'; } catch (err) {}
      track('aff_open');
      var aw = null;
      try { aw = window.open(affU, '_blank'); } catch (err) {}
      if (aw) { try { aw.opener = null; } catch (err) {} return; }
      if (soalMobile) {
        e.preventDefault();
        var nw = null;
        try { nw = window.open(openLink.href, '_blank'); } catch (err) {}
        if (nw) { try { nw.opener = null; } catch (err) {} }
        setTimeout(function () { window.location.href = affU; }, 150);
      }
    });

    acts.appendChild(copyBtn);
    acts.appendChild(openLink);
    li.appendChild(num);
    li.appendChild(tick);
    li.appendChild(span);
    li.appendChild(acts);
    return li;
  }

  function visibleList() {
    var out = [];
    for (var i = 0; i < keys.length; i++) {
      var item = keys[i];
      if (hideUsed && isUsed(item.k)) { continue; }
      out.push({ key: item.k, no: item.no });
    }
    return out;
  }

  var toastEl = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var toastAct = document.getElementById('toastAct');
  var toastTimer = null;
  var toastActHandler = null;
  function hideToastNow() {
    if (!toastEl) { return; }
    toastEl.classList.add('hide');
    toastTimer = setTimeout(function () {
      toastEl.hidden = true;
      toastEl.className = 'toast';
      if (toastAct) { toastAct.hidden = true; }
      toastActHandler = null;
    }, 200);
  }
  if (toastAct) {
    toastAct.addEventListener('click', function () {
      var fn = toastActHandler;
      if (toastTimer) { clearTimeout(toastTimer); }
      hideToastNow();
      if (fn) { fn(); }
    });
  }
  function toast(text, warn, actLabel, actFn, duration) {
    if (!toastEl || !text) { return; }
    toastMsg.textContent = text;
    var hasAct = !!(actLabel && actFn);
    if (toastAct) {
      toastAct.hidden = !hasAct;
      toastAct.textContent = hasAct ? actLabel : '';
    }
    toastActHandler = hasAct ? actFn : null;
    toastEl.className = 'toast' + (warn ? ' warn' : '') + (hasAct ? ' has-act' : '');
    toastEl.hidden = false;
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(hideToastNow, duration || 3400);
  }

  function render() {
    var list = visibleList();

    var frag = document.createDocumentFragment();
    list.forEach(function (item) {
      frag.appendChild(makeRow(item.key, String(item.no).padStart(2, '0')));
    });
    listEl.textContent = '';
    listEl.appendChild(frag);
    listEl.hidden = list.length === 0;

    emptyEl.hidden = list.length > 0 || loading;
    emptyEl.textContent = totalPool === 0 ? t('noKeys') : t('noMatch');

    var rest = Math.max(0, totalFiltered - keys.length);
    moreEl.hidden = !hasMore || rest <= 0;
    if (hasMore && rest > 0) {
      moreEl.textContent = t('more', { n: fmt(Math.min(PAGE, rest)), r: fmt(rest) });
    }

    if (query) {
      statEl.textContent = t('statFiltered', { a: fmt(totalFiltered), b: fmt(totalPool) });
    } else if (hideUsed) {
      statEl.textContent = t('statAvail', { a: fmt(Math.max(0, totalPool - used.length)), b: fmt(totalPool) });
    } else {
      statEl.textContent = t('statKeys', { n: fmt(totalPool) });
    }

    if (footTools && resetUsedBtn) {
      footTools.hidden = used.length === 0;
      if (used.length > 0) {
        resetUsedBtn.textContent = t('resetUsed', { n: fmt(used.length) });
      }
    }
  }

  function refreshToken() {
    return fetch('?action=token&t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) { throw new Error('token'); } return r.json(); })
      .then(function (d) {
        if (d && d.kt) {
          window.__KT = d.kt;
          window.__KTS = d.kts || Math.floor(Date.now() / 1000);
          __T0 = Date.now();
        }
      });
  }

  function loadPage(append, autoDepth, retried) {
    if (loading) { return; }
    loading = true;
    var mySeq = ++reqSeq;
    var off = append ? keys.length : 0;
    var url = '?action=get&offset=' + off + '&limit=' + PAGE + (query ? '&q=' + encodeURIComponent(query) : '') + '&t=' + Date.now();
    fetch(url, { cache: 'no-store', credentials: 'same-origin', headers: authHeaders() })
      .then(function (r) {
        if (r.status === 403 && !retried) {
          loading = false;
          return refreshToken().then(function () { loadPage(append, autoDepth, true); });
        }
        if (r.status === 429 || r.status === 403) { throw new Error('blocked'); }
        return r.json();
      })
      .then(function (env) {
        if (!env) { return; }
        loading = false;
        if (mySeq !== reqSeq) { return; }
        var data = (env && env.d) ? deobf(env.d, window.__KT || '') : env;
        var items = Array.isArray(data.items) ? data.items : [];
        totalPool = Number(data.total || 0);
        totalFiltered = Number(data.filtered || 0);
        keys = append ? keys.concat(items) : items;
        hasMore = keys.length < totalFiltered;
        if (retryBtn) { retryBtn.hidden = true; }
        render();
        if (hideUsed && hasMore && visibleList().length < 20 && (autoDepth || 0) < 3) {
          loadPage(true, (autoDepth || 0) + 1);
        }
      })
      .catch(function () {
        loading = false;
        if (mySeq !== reqSeq) { return; }
        statEl.textContent = t('loadFailed');
        if (retryBtn) { retryBtn.hidden = false; }
      });
  }

  function load() { loadPage(false, 0); }

  function normalize(raw) {
    var s = String(raw).trim();
    if (!s) return null;
    var m = s.match(/[?&]id=([A-Za-z0-9_-]{3,40})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{5,40}$/.test(s)) return s;
    return null;
  }

  function openSheet() {
    sheet.hidden = false;
    msg.textContent = '';
    ta.focus();
  }

  function closeSheet() { sheet.hidden = true; }

  document.getElementById('openImport').addEventListener('click', openSheet);

    if (nextQ === query) { return; }
    query = nextQ;
    if (searchTimer) { clearTimeout(searchTimer); }
    searchTimer = setTimeout(function () { loadPage(false, 0); }, 350);
  });

  hideEl.addEventListener('change', function () {
    hideUsed = hideEl.checked;
    try { localStorage.setItem(HIDE_LS, hideUsed ? '1' : '0'); } catch (e) {}
    render();
    if (hideUsed && hasMore && visibleList().length < 20) {
      loadPage(true, 0);

  });

  moreEl.addEventListener('click', function () { loadPage(true, 0); });
  if (retryBtn) {
    retryBtn.addEventListener('click', function () {
      retryBtn.hidden = true;
      loadPage(keys.length > 0, 0);
    });
  }
  if (resetUsedBtn) {
    resetUsedBtn.addEventListener('click', function () {
      if (!used.length) { return; }
      if (!window.confirm(t('resetConfirm'))) { return; }
      used = [];
      persistUsed();
      render();
      toast(t('resetDone'));
    });
  }

  langEl.addEventListener('change', function () {
    lang = I18N[langEl.value] ? langEl.value : 'en';
    try { localStorage.setItem(LANG_LS, lang); } catch (e) {}
    applyLang();
    render();
  });

  saveBtn.addEventListener('click', function () {
    var lines = ta.value.split('\n');
    var payload = [];
    for (var i = 0; i < lines.length; i++) {
      var k = normalize(lines[i]);
      if (k) { payload.push(k); }
    }
    if (!payload.length) {
      msg.textContent = t('noReadable');
      return;
    }
    saveBtn.disabled = true;
    msg.textContent = t('saving');
    fetch('?action=save', {
      method: 'POST',
      credentials: 'same-origin',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ keys: payload })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        saveBtn.disabled = false;
        if (res.status !== 'success') {
          msg.textContent = t('saveFailed');
          return;
        }
        loadPage(false, 0);
        ta.value = '';
        closeSheet();
        var parts = [res.added ? t('added', { n: fmt(res.added) }) : t('noneNew')];
        if (res.skipped) { parts.push(t('dup', { n: fmt(res.skipped) })); }
        if (res.invalid) { parts.push(t('bad', { n: fmt(res.invalid) })); }
        toast(parts.join(' · '), !res.added);
        track(payload.length > 1 ? 'bulk' : 'add');
      })
      .catch(function () {
        saveBtn.disabled = false;
        msg.textContent = t('saveFailed');
      });
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sheet.hidden && keys.length === 0) { load(); }
  });

  applyLang();
  load();

  try {
    var GEO_LS = 'nusukkey.geo.v1';
    var lastGeo = Number(localStorage.getItem(GEO_LS) || 0);
    if (!lastGeo || Date.now() - lastGeo > 43200000) {
      localStorage.setItem(GEO_LS, String(Date.now()));
      fetch('?action=geo', { cache: 'no-store', credentials: 'same-origin', headers: authHeaders() }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
