*{box-sizing:border-box}

  color:var(--n600);font-size:16px;line-height:1;cursor:pointer;padding:0}
.clr:hover{background:var(--n100)}
.clr.on{display:block}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--n500)}
main{max-width:480px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}

.item .q,.item .a{margin:0;font-size:13.5px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}

.item .a .lbl{color:var(--green-700);opacity:.7}

.markq{font-weight:600}
.empty{margin:26px 0;text-align:center;color:var(--n500);font-size:13px;line-height:1.6}

.note{margin:16px 0 0;font-size:11px;color:var(--n400);text-align:center;line-height:1.5}
